<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Aether Depth Tunnel</title>
<meta name="description" content="An endless feed on the Z axis. Scroll or swipe to fly forward through a 3D void; hold an echo to catch it." />
<meta name="theme-color" content="#030305" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Familjen Grotesk"', 'Helvetica Neue', 'Arial', 'sans-serif'],
          body: ['Manrope', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
        }
      }
    }
  };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js" crossorigin></script>

<style>
  :root {
    color-scheme: dark;
    --void: #030305;
    --ink: #edeef4;
    --ink-dim: #9b9bab;
    --ink-mute: #66667a;
    --hair: rgba(255, 255, 255, 0.08);
    --hair-lit: rgba(255, 255, 255, 0.18);
    --sa-t: env(safe-area-inset-top, 0px);
    --sa-b: env(safe-area-inset-bottom, 0px);
    --sa-l: env(safe-area-inset-left, 0px);
    --sa-r: env(safe-area-inset-right, 0px);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: var(--void);
    color: var(--ink);
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }

  #root { height: 100%; }
  ::selection { background: rgba(94, 231, 255, 0.25); }

  /* ══ the void ══════════════════════════════════════════════ */

  .void {
    position: relative;
    height: 100vh;
    height: 100dvh;         /* dodges the mobile address-bar resize */
    width: 100vw;
    overflow: hidden;
    background: var(--void);
    touch-action: none;     /* we own every gesture in here */
    -webkit-user-select: none;
            user-select: none;
  }

  .nebula {
    position: absolute;
    inset: -25%;
    pointer-events: none;
    background:
      radial-gradient(38% 30% at 26% 32%, rgba(96, 78, 214, 0.17), transparent 68%),
      radial-gradient(32% 26% at 76% 68%, rgba(0, 134, 168, 0.14), transparent 70%),
      radial-gradient(46% 40% at 52% 50%, rgba(255, 77, 157, 0.06), transparent 74%);
    animation: drift 78s ease-in-out infinite alternate;
    transition: opacity 800ms ease;
    will-change: transform;
  }

  @keyframes drift {
    0%   { transform: translate3d(-2.5%, 1.5%, 0) scale(1.04); }
    50%  { transform: translate3d(2%, -2.5%, 0) scale(1.12); }
    100% { transform: translate3d(-1%, 2.5%, 0) scale(1.02); }
  }

  .field { position: absolute; inset: 0; pointer-events: none; }

  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.055;
    mix-blend-mode: screen;
    z-index: 30;
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: radial-gradient(62% 56% at 50% 50%, transparent 40%, rgba(3, 3, 5, 0.86) 100%);
    transition: opacity 900ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .spotlight {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1100px;
    height: 1100px;
    margin: -550px 0 0 -550px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 5;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 900ms ease, transform 1100ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .spotlight.on { opacity: 1; transform: scale(1); }

  /* ══ 3D stage ══════════════════════════════════════════════ */

  .stage {
    position: absolute;
    inset: 0;
    perspective: 1200px;
    perspective-origin: 50% 50%;
    transform-style: preserve-3d;
    z-index: 10;
  }

  .stage-inner { position: absolute; inset: 0; transform-style: preserve-3d; }

  .slot {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-style: preserve-3d;
  }

  .slot.settling { transition: transform 820ms cubic-bezier(0.16, 1, 0.3, 1); }

  /* filter/opacity live on their own layer so the 3D transform above is never flattened */
  .lens { transform-origin: 50% 50%; backface-visibility: hidden; }
  .lens.settling { transition: filter 820ms cubic-bezier(0.16, 1, 0.3, 1), opacity 640ms ease-out; }

  /* ══ echo card ═════════════════════════════════════════════ */

  .card {
    position: relative;
    border-radius: 28px;
    padding: 26px 28px 24px;
    border: 1px solid var(--hair);
    background: rgba(255, 255, 255, 0.03);
    text-align: left;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 460ms ease, background-color 460ms ease,
                box-shadow 640ms cubic-bezier(0.16, 1, 0.3, 1), transform 460ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .card.near { -webkit-backdrop-filter: blur(36px) saturate(150%); backdrop-filter: blur(36px) saturate(150%); }
  .card.live:hover { background: rgba(255, 255, 255, 0.055); border-color: var(--hair-lit); transform: scale(1.014); }
  .card:focus-visible { box-shadow: 0 0 0 2px rgba(237, 238, 244, 0.8), 0 0 0 8px rgba(237, 238, 244, 0.1); }

  /* specular hairline along the top edge */
  .card::before {
    content: '';
    position: absolute;
    inset: 0 0 auto 0;
    height: 1px;
    border-radius: 28px 28px 0 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3) 20%, rgba(255,255,255,0.52) 50%, rgba(255,255,255,0.3) 80%, transparent);
    opacity: 0.75;
    pointer-events: none;
  }

  .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }

  .handle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink);
  }

  .sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-mute);
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  .echo-text {
    font-family: 'Familjen Grotesk', Helvetica Neue, Arial, sans-serif;
    font-weight: 500;
    font-size: 27px;
    line-height: 1.26;
    letter-spacing: -0.019em;
    color: var(--ink);
    text-wrap: balance;
    margin: 0;
  }

  /* waveform — an echo has a shape */
  .wave { display: flex; align-items: flex-end; gap: 2px; height: 26px; margin-top: 22px; }
  .wave i {
    display: block;
    flex: 1;
    min-width: 0;
    border-radius: 1px;
    transform-origin: bottom center;
    transition: opacity 500ms ease;
  }
  .wave.playing i { animation: pulse 1500ms ease-in-out infinite; }

  @keyframes pulse {
    0%, 100% { transform: scaleY(1); }
    50%      { transform: scaleY(0.42); }
  }

  .stamp {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.07em;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }

  .drawer {
    display: grid;
    grid-template-rows: 0fr;
    opacity: 0;
    overflow: hidden;
    transition: grid-template-rows 660ms cubic-bezier(0.16, 1, 0.3, 1), opacity 440ms ease;
  }
  .drawer.open { grid-template-rows: 1fr; opacity: 1; }
  .drawer > div { min-height: 0; }

  .drawer-inner {
    margin-top: 20px;
    padding-top: 17px;
    border-top: 1px solid rgba(255, 255, 255, 0.07);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .track { position: relative; flex: 1; height: 2px; background: rgba(255,255,255,0.09); overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; height: 100%; transform-origin: left center; transition: transform 950ms cubic-bezier(0.16, 1, 0.3, 1); }

  /* hold-to-catch ring */
  .ring { position: absolute; left: 50%; bottom: -22px; transform: translateX(-50%); pointer-events: none; }
  .ring circle.arc { transform: rotate(-90deg); transform-origin: 50% 50%; stroke-dasharray: 88; stroke-dashoffset: 88; }
  .ring.arming circle.arc { animation: arm 320ms linear forwards; }
  @keyframes arm { to { stroke-dashoffset: 0; } }

  .halo {
    position: absolute;
    inset: -1px;
    border-radius: 28px;
    pointer-events: none;
    animation: breathe 3800ms ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

  /* ══ plates in the tunnel: masthead + depth markers ════════ */

  .plate { text-align: center; }

  .masthead h1 {
    font-family: 'Familjen Grotesk', sans-serif;
    font-weight: 700;
    font-size: clamp(46px, 13vw, 104px);
    letter-spacing: 0.14em;
    line-height: 0.94;
    margin: 0 0 0 0.14em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 0%, #b9bdd6 62%, #6e7391 100%);
    -webkit-background-clip: text;
            background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 46px rgba(139, 124, 255, 0.32));
  }

  .marker-km {
    font-family: 'Familjen Grotesk', sans-serif;
    font-weight: 600;
    font-size: clamp(40px, 9vw, 68px);
    letter-spacing: -0.02em;
    line-height: 1;
    margin: 0;
    font-variant-numeric: tabular-nums;
  }

  .rule-h { height: 1px; background: linear-gradient(90deg, transparent, var(--hair-lit) 30%, var(--hair-lit) 70%, transparent); }

  /* ══ HUD ═══════════════════════════════════════════════════ */

  .hud { position: absolute; inset: 0; pointer-events: none; z-index: 40; }
  .hud button { pointer-events: auto; }

  .hud-tl { position: absolute; top: calc(42px + var(--sa-t)); left: calc(46px + var(--sa-l)); }
  .hud-tr { position: absolute; top: calc(42px + var(--sa-t)); right: calc(46px + var(--sa-r)); text-align: right; display: grid; gap: 6px; justify-items: end; }
  .hud-bl { position: absolute; bottom: calc(44px + var(--sa-b)); left: calc(46px + var(--sa-l)); width: 246px; }
  .hud-br { position: absolute; bottom: calc(44px + var(--sa-b)); right: calc(46px + var(--sa-r)); display: flex; gap: 10px; }
  .hud-bc { position: absolute; bottom: calc(46px + var(--sa-b)); left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }

  .readout {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--ink-dim);
  }
  .readout b { color: var(--ink); font-weight: 500; }

  .bracket { position: absolute; width: 20px; height: 20px; pointer-events: none; }
  .bracket.tl { top: calc(20px + var(--sa-t)); left: calc(20px + var(--sa-l)); border-top: 1px solid var(--hair-lit); border-left: 1px solid var(--hair-lit); }
  .bracket.tr { top: calc(20px + var(--sa-t)); right: calc(20px + var(--sa-r)); border-top: 1px solid var(--hair-lit); border-right: 1px solid var(--hair-lit); }
  .bracket.bl { bottom: calc(20px + var(--sa-b)); left: calc(20px + var(--sa-l)); border-bottom: 1px solid var(--hair-lit); border-left: 1px solid var(--hair-lit); }
  .bracket.br { bottom: calc(20px + var(--sa-b)); right: calc(20px + var(--sa-r)); border-bottom: 1px solid var(--hair-lit); border-right: 1px solid var(--hair-lit); }

  .wordmark-sm {
    font-family: 'Familjen Grotesk', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.44em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .throttle { position: relative; width: 172px; height: 2px; background: rgba(255,255,255,0.1); overflow: hidden; }
  .throttle i { position: absolute; inset: 0 auto 0 0; height: 100%; transform-origin: left center; }

  /* proximity radar: the next 3 km ahead of the lens */
  .radar { position: absolute; right: calc(34px + var(--sa-r)); top: 50%; transform: translateY(-50%); height: min(54vh, 440px); width: 40px; }
  .radar-line { position: absolute; right: 9px; top: 0; bottom: 0; width: 1px; background: linear-gradient(180deg, transparent, rgba(255,255,255,0.15) 7%, rgba(255,255,255,0.15) 93%, transparent); }
  .blip { position: absolute; right: 5px; width: 8px; height: 1px; transition: width 300ms ease, opacity 300ms ease; }
  .blip.caught { width: 20px; }
  .blip.marker { width: 15px; height: 1px; background: rgba(255,255,255,0.4); }
  .lens-line { position: absolute; right: 0; bottom: 0; width: 26px; height: 1px; background: var(--ink); box-shadow: 0 0 11px rgba(237,238,244,0.75); }
  .lens-line::after { content: ''; position: absolute; right: -1px; top: -2.5px; width: 5px; height: 5px; background: var(--ink); transform: rotate(45deg); }

  .hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-mute);
    text-align: center;
    transition: opacity 700ms ease, transform 700ms cubic-bezier(0.16, 1, 0.3, 1);
  }

  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--ink-dim);
    border: 1px solid var(--hair);
    background: rgba(255, 255, 255, 0.035);
    border-radius: 999px;
    padding: 9px 17px;
    cursor: pointer;
    min-height: 38px;
    transition: color 280ms ease, border-color 280ms ease, background-color 280ms ease;
  }
  .pill:hover { color: var(--ink); border-color: var(--hair-lit); background: rgba(255,255,255,0.075); }
  .pill:focus-visible { outline: 2px solid rgba(237,238,244,0.7); outline-offset: 3px; }

  .panel {
    border: 1px solid var(--hair);
    background: rgba(255, 255, 255, 0.022);
    -webkit-backdrop-filter: blur(20px);
            backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 13px 15px;
  }

  .chev { display: block; margin: 0 auto 9px; animation: rise 2200ms ease-in-out infinite; }
  @keyframes rise {
    0%, 100% { transform: translateY(4px); opacity: 0.35; }
    50%      { transform: translateY(-4px); opacity: 1; }
  }

  /* ══ phones and small tablets ══════════════════════════════ */

  @media (max-width: 760px) {
    .card { padding: 20px 19px 18px; border-radius: 22px; }
    .card::before { border-radius: 22px 22px 0 0; }
    .halo { border-radius: 22px; }
    /* a 36 px backdrop blur on a phone GPU is a slideshow */
    .card.near { -webkit-backdrop-filter: blur(16px) saturate(130%); backdrop-filter: blur(16px) saturate(130%); }
    .echo-text { font-size: 21px; line-height: 1.3; }
    .card-head { gap: 10px; margin-bottom: 15px; }
    .wave { height: 20px; margin-top: 16px; }
    .drawer-inner { margin-top: 15px; padding-top: 13px; gap: 10px; }
    .grain { display: none; }              /* full-screen feTurbulence is too costly here */

    .hud-tl { top: calc(16px + var(--sa-t)); left: calc(18px + var(--sa-l)); }
    .hud-tr { top: calc(16px + var(--sa-t)); right: calc(18px + var(--sa-r)); gap: 3px; }
    .hud-bl { bottom: calc(74px + var(--sa-b)); left: calc(18px + var(--sa-l)); width: auto; right: calc(18px + var(--sa-r)); }
    .hud-br { bottom: calc(18px + var(--sa-b)); right: calc(18px + var(--sa-r)); gap: 8px; }
    .hud-bc { bottom: calc(24px + var(--sa-b)); left: 18px; right: 118px; justify-content: flex-start; }
    .hud-bc .hint { text-align: left; }

    .bracket { width: 14px; height: 14px; }
    .bracket.tl, .bracket.tr { top: calc(10px + var(--sa-t)); }
    .bracket.bl, .bracket.br { bottom: calc(10px + var(--sa-b)); }
    .bracket.tl, .bracket.bl { left: calc(10px + var(--sa-l)); }
    .bracket.tr, .bracket.br { right: calc(10px + var(--sa-r)); }

    .radar { right: calc(12px + var(--sa-r)); height: 34vh; width: 26px; }
    .radar-line { right: 6px; }
    .blip { right: 3px; width: 6px; }
    .blip.caught { width: 15px; }
    .lens-line { width: 19px; }

    .wordmark-sm { font-size: 11px; letter-spacing: 0.36em; }
    .readout { font-size: 10px; }
    .eyebrow { font-size: 8.5px; letter-spacing: 0.16em; }
    .pill { padding: 10px 14px; font-size: 9px; letter-spacing: 0.12em; }
    .panel { padding: 9px 12px; border-radius: 11px; }
    .masthead h1 { letter-spacing: 0.1em; }
  }

  @media (max-width: 420px) {
    .echo-text { font-size: 19px; }
    .card { padding: 17px 16px 16px; }
  }

  /* landscape phones have almost no vertical room */
  @media (max-height: 460px) and (max-width: 940px) {
    .echo-text { font-size: 17px; }
    .card { padding: 14px 16px 13px; }
    .wave { height: 14px; margin-top: 12px; }
    .card-head { margin-bottom: 11px; }
    .radar { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .nebula, .halo, .wave.playing i, .chev { animation: none; }
    .slot.settling, .lens.settling, .drawer { transition-duration: 1ms; }
    .ring.arming circle.arc { animation-duration: 1ms; }
  }
</style>
</head>
<body>
<div id="root"></div>
<noscript>
  <div style="padding:48px;font-family:Manrope,sans-serif;color:#edeef4">
    Aether is a real-time 3D interface and needs JavaScript enabled.
  </div>
</noscript>

<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

/* ══════════════════════════════════════════════════════════════
   1. THE CORPUS — 40 written echoes, dealt into an endless tunnel
   ══════════════════════════════════════════════════════════════ */

const PALETTE = ['#5EE7FF', '#FF4D9D', '#FFB454', '#8B7CFF', '#4FFFC4'];

const CORPUS = [
  { author: 'sable.ng',     place: 'Lagos',     text: 'I deleted the app that knew me best and my hands still find the shape of it in my pocket.' },
  { author: 'oyinda',       place: 'Ibadan',    text: 'My grandmother measured a good day by how many people she fed. I measure mine in unread.' },
  { author: 'kirinwaves',   place: 'Osaka',     text: 'Nobody warns you that the algorithm learns your loneliness faster than your friends do.' },
  { author: 'quietfloor',   place: 'Tallinn',   text: 'There is a version of me that exists only at 2am and only for strangers.' },
  { author: 'tanvi.raw',    place: 'Pune',      text: 'I miss being bored. Real boredom. The kind with a ceiling fan and no plan.' },
  { author: 'm.orozco',     place: 'Bogotá',    text: 'We call it a feed because something is being fattened, and it is not us.' },
  { author: 'lowbeam',      place: 'Glasgow',   text: 'Took the long way home just to have a thought nobody could reply to.' },
  { author: 'aditi.k',      place: 'Kochi',     text: 'Rain on a tin roof is the only content I have never once wanted to skip.' },
  { author: 'nine.volts',   place: 'Detroit',   text: 'I have four thousand photographs of the sky and cannot remember a single sunset.' },
  { author: 'reya',         place: 'Beirut',    text: 'The scroll never ends because an ending would let you stand up.' },
  { author: 'haltsign',     place: 'Rotterdam', text: 'First real silence in six years: a lift with no signal, forty seconds, eighth floor.' },
  { author: 'sofie.wren',   place: 'Malmö',     text: 'I want to be known slowly. Chapter by chapter. Not in a grid of squares.' },
  { author: 'dev.null.ish', place: 'Austin',    text: 'Everyone I love is currently inside a rectangle and I hate it here.' },
  { author: 'amara.t',      place: 'Nairobi',   text: 'Made tea, forgot it, made another. Grief is mostly small logistics.' },
  { author: 'p.mahesh',     place: 'Chennai',   text: 'My attention is the only thing I own outright and I keep handing it over for free.' },
  { author: 'coilroom',     place: 'Bengaluru', text: 'Somewhere in Bengaluru a man still repairs radios and does not know he is a monument.' },
  { author: 'juno.b',       place: 'Lisbon',    text: 'Held my breath through the whole tunnel like I did at nine. Still works.' },
  { author: 'thewholeway',  place: 'Vancouver', text: 'If you have to hold a thought to hear it, maybe that was always the honest price.' },
  { author: 'mirrorless',   place: 'Seoul',     text: 'The best conversation I had this year left no screenshots behind.' },
  { author: 'aether.zero',  place: 'nowhere',   text: 'Whatever you chase forward is travelling away from you at exactly the same speed.' },
  { author: 'v.okonkwo',    place: 'Enugu',     text: 'Nine hours of screen time and not one thing I could describe to my mother.' },
  { author: 'slowbus',      place: 'Bristol',   text: 'The bus was late and for twenty minutes I was a person again.' },
  { author: 'thumbroute',   place: 'Manila',    text: 'I know the shape of my thumb’s route better than my own street.' },
  { author: 'no.weather',   place: 'Reykjavik', text: 'Every app wants to be a place. None of them have weather.' },
  { author: 'archivist',    place: 'Kraków',    text: 'I archived the photos and the grief just changed folders.' },
  { author: 'twoinakitchen', place: 'Cork',     text: 'Turns out I do not want an audience. I want two people and a kitchen.' },

/* flight + optics constants */
const FIRST_Z     = 1000;
const SPACING     = 540;     // mean metres between echoes
const MILESTONE   = 5000;    // a depth marker every 5 km, forever
const MASTHEAD_Z  = 0;
const MIN_Z       = -300;    // you can back up behind the title, no further
const CULL_BEHIND = -200;
const CULL_AHEAD  = 3000;
const SWEET_NEAR  = 0;
const SWEET_FAR   = 500;
const FOCUS_Z     = 300;
const FRICTION    = 0.928;
const WHEEL_GAIN  = 0.6;
const DRAG_GAIN   = 1.35;
const MAX_VEL     = 135;
const HOLD_MS     = 320;
const DRAG_SLOP   = 12;      // px of movement that cancels a catch
const BASE_PERSP  = 1200;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const clamp01 = v => clamp(v, 0, 1);
const fmt = n => Math.round(n).toLocaleString('en-IN');

const fmtDepth = m => (m < 10000 ? fmt(m) + ' m' : (m / 1000).toFixed(1) + ' km');

const fmtClock = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

/* depth is the timeline: the deeper an echo sits, the older it is */
function ageAt(z) {
  const mins = Math.pow(Math.max(z, 1) / 1000, 1.6) * 8;
  if (mins < 60) return Math.max(1, Math.round(mins)) + ' m';
  if (mins < 1440) return Math.round(mins / 60) + ' h';
  if (mins < 10080) return Math.round(mins / 1440) + ' d';
  if (mins < 43800) return Math.round(mins / 10080) + ' w';
  if (mins < 525600) return Math.round(mins / 43800) + ' mo';
  return Math.round(mins / 525600) + ' y';
}

/* deterministic hash, so echo 8 412 is identical on every device and reload */
function hash(n) {
  const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453;
  return x - Math.floor(x);
}

/* ── the infinite feed ─────────────────────────────────────────
   Nothing is stored in an array. Echo n is *computed* from n, so
   the tunnel is endless and identical for everyone. Only the six
   or so in camera range are ever mounted.                       */

const CACHE = new Map();

function echoAt(n) {
  const hit = CACHE.get(n);
  if (hit) return hit;

  const h1 = hash(n * 1.13 + 0.7);
  const h2 = hash(n * 2.71 + 1.9);
  const h3 = hash(n * 3.37 + 4.1);
  const h4 = hash(n * 5.11 + 2.3);

  const lap = Math.floor(n / CORPUS.length);
  // stride 17 is coprime with 40, so each lap deals the corpus in a new order
  const item = CORPUS[(n * 17 + lap * 7) % CORPUS.length];

  const z = FIRST_Z + n * SPACING + (h1 * 2 - 1) * 96;

  const echo = {
    n, z,
    x: (h2 * 2 - 1) * 262,
    y: (h3 * 2 - 1) * 148,
    c: PALETTE[(n * 3 + lap) % PALETTE.length],
    res: 0.12 + h4 * 0.88,
    author: item.author,
    place: item.place,
    text: item.text,
    age: ageAt(z)
  };

  if (CACHE.size > 4000) CACHE.clear();
  CACHE.set(n, echo);
  return echo;
}

const firstIndex = pos => Math.max(0, Math.floor((pos + CULL_BEHIND - FIRST_Z) / SPACING) - 1);
const lastIndex = pos => Math.max(0, Math.ceil((pos + CULL_AHEAD - FIRST_Z) / SPACING) + 1);

/* every depth marker owns 760 m of clear tunnel — the echo that would have
   landed there is simply not dealt, which reads as breathing room */
function nearMarker(z) {
  const m = ((z % MILESTONE) + MILESTONE) % MILESTONE;
  return m < 380 || m > MILESTONE - 380;
}

/* shared depth optics */
function optics(distance) {
  const opacity = clamp01((CULL_AHEAD - distance) / 900) * clamp01((distance - CULL_BEHIND) / 200);
  let blur = 0;
  if (distance > SWEET_FAR) blur = Math.min(14, ((distance - SWEET_FAR) / 1500) * 10);
  else if (distance < SWEET_NEAR) blur = clamp01(-distance / 200) * 8;
  return { opacity, blur };
}

function waveform(n, res) {
  return Array.from({ length: 34 }, (_, i) => {
    const a = Math.sin(i * 1.73 + n * 2.31) * 0.5 + 0.5;
    const b = Math.sin(i * 0.51 + n * 1.07) * 0.5 + 0.5;
    return 0.16 + (a * 0.58 + b * 0.42) * (0.42 + res * 0.58) * 0.88;
  });
}

/* ══════════════════════════════════════════════════════════════
   2. VIEWPORT — one place that decides what a phone gets
   ══════════════════════════════════════════════════════════════ */

function readViewport() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const compact = w < 760;
  const touch = (navigator.maxTouchPoints || 0) > 0 || 'ontouchstart' in window;
  return {
    w, h, compact, touch,
    // pull the off-axis scatter in, or cards fly off the sides of a phone
    spread: clamp(w / 900, 0.34, 1),
    cardW: compact ? Math.min(w - 34, 400) : 452,
    // backdrop-filter is the expensive property; grant it to fewer cards
    nearLimit: compact ? 900 : 1600,
    motes: compact ? 110 : 300,
    ringsTo: compact ? 6200 : 9200,
    dprCap: compact ? 1.5 : 2
  };
}

function useViewport() {
  const [vp, setVp] = useState(readViewport);
  useEffect(() => {
    let t = 0;
    const on = () => { clearTimeout(t); t = setTimeout(() => setVp(readViewport()), 120); };
    window.addEventListener('resize', on);
    window.addEventListener('orientationchange', on);
    return () => { clearTimeout(t); window.removeEventListener('resize', on); window.removeEventListener('orientationchange', on); };
  }, []);
  return vp;
}

/* ══════════════════════════════════════════════════════════════
   3. THE VOID — projected dust and a wireframe tunnel, on canvas
   ══════════════════════════════════════════════════════════════ */

function Field({ camRef, velRef, vp }) {
  const canvasRef = useRef(null);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d', { alpha: true });
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const SPAN = 9000;
    const FOCAL = 900;
    const RING_GAP = 560;
    const RING_R = 1150;
    const RINGS_TO = vp.ringsTo;

    const motes = Array.from({ length: vp.motes }, () => ({
      x: (Math.random() - 0.5) * 5400,
      y: (Math.random() - 0.5) * 3500,
      z: Math.random() * SPAN,
      w: 0.35 + Math.random() * 0.65
    }));

    let w = 0, h = 0, raf = 0;

    const resize = () => {
      const dpr = Math.min(window.devicePixelRatio || 1, vp.dprCap);
      w = canvas.clientWidth;
      h = canvas.clientHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    };
    resize();
    window.addEventListener('resize', resize);

    const draw = () => {
      const cam = camRef.current;
      const vel = velRef.current;
      const cx = w / 2, cy = h / 2;
      ctx.clearRect(0, 0, w, h);

      /* hexagonal rings receding down the z axis — this is what reads as flight */
      const first = Math.ceil((cam + 200) / RING_GAP) * RING_GAP;
      for (let z = first; z < cam + RINGS_TO; z += RING_GAP) {
        const d = z - cam;
        const s = FOCAL / d;
        const r = RING_R * s;
        if (r < 6) continue;
        const near = 1 - d / RINGS_TO;
        const a = near * near * 0.2;
        if (a < 0.004) continue;

        ctx.strokeStyle = 'rgba(150, 166, 224, ' + a.toFixed(4) + ')';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let k = 0; k <= 6; k++) {
          const ang = (k / 6) * Math.PI * 2 - Math.PI / 12;
          const px = cx + Math.cos(ang) * r * 1.42;
          const py = cy + Math.sin(ang) * r;
          if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      }

      /* longitudinal spokes converging on the vanishing point */
      ctx.strokeStyle = 'rgba(150, 166, 224, 0.05)';
      for (let k = 0; k < 6; k++) {
        const ang = (k / 6) * Math.PI * 2 - Math.PI / 12;
        const sNear = FOCAL / 400, sFar = FOCAL / RINGS_TO;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * RING_R * 1.42 * sNear, cy + Math.sin(ang) * RING_R * sNear);
        ctx.lineTo(cx + Math.cos(ang) * RING_R * 1.42 * sFar, cy + Math.sin(ang) * RING_R * sFar);
        ctx.stroke();
      }

      /* dust, smearing into streaks as velocity climbs */
      ctx.lineCap = 'round';
      for (let i = 0; i < motes.length; i++) {
        const m = motes[i];
        let d = (m.z - cam) % SPAN;
        if (d < 0) d += SPAN;
        if (d < 130) continue;

        const s = FOCAL / d;
        const px = cx + m.x * s;
        const py = cy + m.y * s;
        if (px < -40 || px > w + 40 || py < -40 || py > h + 40) continue;

        const near = 1 - d / SPAN;
        const alpha = clamp01(near * near * 0.85 + 0.04) * m.w;
        const size = clamp(s * 1.9 * m.w, 0.35, 2.9);
        const streak = Math.min(Math.abs(vel) * 0.55, 120) * s;

        if (streak > 1.2) {
          const s2 = FOCAL / Math.max(d - Math.sign(vel) * streak / s, 140);
          ctx.strokeStyle = 'rgba(214, 226, 255, ' + (alpha * 0.72).toFixed(3) + ')';
          ctx.lineWidth = size;
          ctx.beginPath();
          ctx.moveTo(px, py);
          ctx.lineTo(cx + m.x * s2, cy + m.y * s2);
          ctx.stroke();
        } else {
          ctx.fillStyle = 'rgba(224, 232, 255, ' + alpha.toFixed(3) + ')';
          ctx.beginPath();
          ctx.arc(px, py, size, 0, 6.2832);
          ctx.fill();
        }
      }

      if (!reduced) raf = requestAnimationFrame(draw);
    };

    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', resize); };
  }, [camRef, velRef, vp]);

  return <canvas ref={canvasRef} className="field" aria-hidden="true" />;
}

/* ══════════════════════════════════════════════════════════════
   4. SIGIL — a generated mark, stable for the life of an echo
   ══════════════════════════════════════════════════════════════ */

function Sigil({ echo, size }) {
  const rot = (echo.n * 47) % 360;
  const arc = 20 + echo.res * 250;
  const C = 2 * Math.PI * 11;
  return (
    <svg width={size} height={size} viewBox="0 0 34 34" aria-hidden="true" style={{ flex: 'none' }}>
      <circle cx="17" cy="17" r="15.5" fill="none" stroke="rgba(255,255,255,0.1)" strokeWidth="1" />
      <circle
        cx="17" cy="17" r="11" fill="none" stroke={echo.c} strokeWidth="1.5" strokeLinecap="round"
        strokeDasharray={((arc / 360) * C).toFixed(2) + ' ' + C}
        transform={'rotate(' + rot + ' 17 17)'}
        opacity="0.9"
      />
      <circle cx="17" cy="17" r="3.4" fill={echo.c} opacity="0.28" />
      <circle
        cx={17 + Math.cos((rot * Math.PI) / 180) * 11}
        cy={17 + Math.sin((rot * Math.PI) / 180) * 11}
        r="1.8" fill={echo.c}
      />
    </svg>
  );
}

/* ══════════════════════════════════════════════════════════════
   5. ECHO — depth optics and the catch mechanic
   ══════════════════════════════════════════════════════════════ */

function Echo({ echo, distance, isCaught, anyCaught, settling, arming, held, vp, onHoldStart, onHoldEnd, onToggle }) {
  const bars = useMemo(() => waveform(echo.n, echo.res), [echo.n, echo.res]);

  if (distance < CULL_BEHIND || distance > CULL_AHEAD) return null;

  let { opacity, blur } = optics(distance);
  if (anyCaught && !isCaught) { opacity *= 0.09; blur += 9; }
  if (isCaught) { opacity = 1; blur = 0; }

  const near = distance < vp.nearLimit;
  const live = opacity > 0.35 && distance > -120 && !(anyCaught && !isCaught);
  const xOff = isCaught ? 0 : echo.x * vp.spread;
  const yOff = isCaught ? 0 : echo.y * vp.spread;

  const shadow = isCaught
    ? '0 0 0 1px ' + echo.c + '5c, 0 0 40px ' + echo.c + '4d, 0 0 130px ' + echo.c + '24, 0 46px 96px rgba(0,0,0,0.66)'
    : '0 28px 74px rgba(0,0,0,0.52), 0 0 36px ' + echo.c + '10';

  return (
    <div
      className={'slot' + (settling ? ' settling' : '')}
      style={{
        width: vp.cardW,
        maxWidth: '94vw',
        transform: 'translate(-50%, -50%) translate3d(' + xOff.toFixed(1) + 'px, ' + yOff.toFixed(1) + 'px, ' + (-distance) + 'px)',
        zIndex: Math.round(12000 - clamp(distance, -1000, 12000))
      }}
    >
      <div
        className={'lens' + (settling ? ' settling' : '')}
        style={{ filter: blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none', opacity }}
      >
        <div
          role="button"
          tabIndex={live ? 0 : -1}
          aria-pressed={isCaught}
          aria-label={'Echo by ' + echo.author + '. ' + echo.text + (isCaught ? ' Caught.' : ' Hold to catch.')}
          className={'card' + (near ? ' near' : '') + (live ? ' live' : '')}
          style={{
            boxShadow: shadow,
            borderColor: isCaught ? echo.c + '52' : undefined,
            background: isCaught ? 'rgba(255,255,255,0.056)' : undefined,
            cursor: live ? 'pointer' : 'default',
            pointerEvents: live ? 'auto' : 'none'
          }}
          onPointerDown={e => { e.preventDefault(); onHoldStart(echo.n, e); }}
          onPointerUp={() => onHoldEnd()}
          onPointerLeave={() => onHoldEnd()}
          onPointerCancel={() => onHoldEnd()}
          onKeyDown={e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onToggle(echo.n); } }}
        >
          {isCaught && (
            <span className="halo" style={{ boxShadow: 'inset 0 0 1px ' + echo.c + '80, 0 0 30px ' + echo.c + '2e' }} />
          )}

          <div className="card-head">
            <Sigil echo={echo} size={vp.compact ? 28 : 34} />
            <div style={{ minWidth: 0 }}>
              <div className="handle">{echo.author}</div>
              <div className="sub">{echo.place} · {echo.age} ago · {fmtDepth(echo.z)}</div>
            </div>
            <span className="sub" style={{ marginLeft: 'auto', color: echo.c, letterSpacing: '0.13em', whiteSpace: 'nowrap' }}>
              {isCaught ? 'HELD ' + held : 'RES ' + Math.round(echo.res * 100)}
            </span>
          </div>

          <p className="echo-text">{echo.text}</p>

          <div className={'wave' + (isCaught ? ' playing' : '')} aria-hidden="true">
            {bars.map((v, i) => (
              <i
                key={i}
                style={{
                  height: (v * 100).toFixed(1) + '%',
                  background: echo.c,
                  opacity: isCaught ? 0.28 + v * 0.62 : 0.1 + v * 0.2,
                  animationDelay: (i * 44) + 'ms'
                }}
              />
            ))}
          </div>

          <div className={'drawer' + (isCaught ? ' open' : '')} aria-hidden={!isCaught}>
            <div>
              <div className="drawer-inner">
                <span className="stamp" style={{ color: echo.c, whiteSpace: 'nowrap' }}>
                  RESONANCE {Math.round(echo.res * 100)}
                </span>
                <div className="track">
                  <div
                    className="fill"
                    style={{
                      background: 'linear-gradient(90deg, ' + echo.c + '00, ' + echo.c + ')',
                      transform: 'scaleX(' + (isCaught ? echo.res : 0) + ')'
                    }}
                  />
                </div>
                {!vp.compact && <span className="stamp" style={{ whiteSpace: 'nowrap' }}>THE FEED IS NOT MOVING</span>}
              </div>
            </div>
          </div>

          {arming && !isCaught && (
            <svg className="ring arming" width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
              <circle cx="15" cy="15" r="14" fill="none" stroke="rgba(255,255,255,0.12)" strokeWidth="1.5" />
              <circle className="arc" cx="15" cy="15" r="14" fill="none" stroke={echo.c} strokeWidth="1.5" strokeLinecap="round" />
            </svg>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   6. MASTHEAD — the title is an object at 0 m, not page chrome
   ══════════════════════════════════════════════════════════════ */

function Masthead({ distance, anyCaught, vp }) {
  if (distance < CULL_BEHIND || distance > CULL_AHEAD) return null;
  let { opacity, blur } = optics(distance);
  if (anyCaught) opacity *= 0.08;

  return (
    <div
      className="slot"
      style={{
        width: vp.compact ? 'min(92vw, 420px)' : 640,
        transform: 'translate(-50%, -50%) translate3d(0, 0, ' + (-distance) + 'px)',
        zIndex: Math.round(12000 - clamp(distance, -1000, 12000)),
        pointerEvents: 'none'
      }}
    >
      <div className="plate masthead" style={{ opacity, filter: blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none' }}>
        <div className="eyebrow" style={{ letterSpacing: '0.36em', marginBottom: vp.compact ? 14 : 22 }}>
          An endless feed, honestly labelled
        </div>
        <h1>Aether</h1>
        <div className="rule-h" style={{ margin: (vp.compact ? '18px' : '26px') + ' auto', width: '78%' }} />
        <p
          style={{
            fontFamily: '"Familjen Grotesk", sans-serif', fontWeight: 400,
            fontSize: vp.compact ? 15 : 19, lineHeight: 1.5, letterSpacing: '-0.008em',
            color: 'var(--ink-dim)', margin: '0 auto', maxWidth: 430, textWrap: 'balance'
          }}
        >
          The timeline runs forward, not down. Thoughts hang ahead of you in the
          dark and get older the deeper you fly. It does not end — so it keeps
          the receipt instead.
        </p>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   7. DEPTH MARKER — every 5 km, the void hands you the bill
   ══════════════════════════════════════════════════════════════ */

const MARKER_LINES = [
  d => 'The void does not end. That is not a feature.',
  d => 'Airborne ' + d.clock + '. Nothing has asked you to stop.',
  d => 'No bottom, no last page, no reason to look up.',
  d => d.passed + ' thoughts have passed you. Name one.',
  d => 'This marker exists because a feed never gives you one.'
];

function Marker({ k, distance, anyCaught, clock, passed, vp }) {
  if (distance < CULL_BEHIND || distance > CULL_AHEAD) return null;
  let { opacity, blur } = optics(distance);
  if (anyCaught) opacity *= 0.08;

  const km = ((k * MILESTONE) / 1000).toFixed(1);
  const line = MARKER_LINES[(k - 1) % MARKER_LINES.length]({ clock, passed });

  return (
    <div
      className="slot"
      style={{
        width: vp.compact ? 'min(90vw, 380px)' : 520,
        transform: 'translate(-50%, -50%) translate3d(0, 0, ' + (-distance) + 'px)',
        zIndex: 2,
        pointerEvents: 'none'
      }}
    >
      <div className="plate" style={{ opacity, filter: blur > 0.05 ? 'blur(' + blur.toFixed(2) + 'px)' : 'none' }}>
        <div className="eyebrow" style={{ letterSpacing: '0.32em' }}>Depth marker</div>
        <div className="rule-h" style={{ margin: '18px auto', width: '54%' }} />
        <p className="marker-km">{km} km</p>
        <p
          style={{
            fontFamily: '"Familjen Grotesk", sans-serif', fontWeight: 400,
            fontSize: vp.compact ? 15 : 18, lineHeight: 1.45, color: 'var(--ink-dim)',
            margin: '16px auto 0', maxWidth: 380, textWrap: 'balance'
          }}
        >
          {line}
        </p>
        <div className="readout" style={{ marginTop: 14, color: 'var(--ink-mute)' }}>
          AIRBORNE {clock} · {passed} PASSED
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   8. AUDIO — a velocity-tracking drone built from oscillators
   ══════════════════════════════════════════════════════════════ */

function useAudio(velRef) {
  const nodes = useRef(null);
  const [on, setOn] = useState(false);

  const toggle = useCallback(() => {
    if (!on) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!nodes.current) {
        const ctx = new AC();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 320;
        gain.gain.value = 0;
        const a = ctx.createOscillator(), b = ctx.createOscillator();
        a.type = 'sine'; a.frequency.value = 55;
        b.type = 'triangle'; b.frequency.value = 82.5;
        a.connect(filter); b.connect(filter);
        filter.connect(gain).connect(ctx.destination);
        a.start(); b.start();
        nodes.current = { ctx, gain, filter };
      }
      const { ctx, gain } = nodes.current;
      ctx.resume();   // iOS only allows this inside a gesture, which this is
      gain.gain.cancelScheduledValues(ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 1.2);
      setOn(true);
    } else {
      const { ctx, gain } = nodes.current;
      gain.gain.cancelScheduledValues(ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
      setOn(false);
    }
  }, [on]);

  useEffect(() => {
    if (!on) return;
    const iv = setInterval(() => {
      const n = nodes.current;
      if (!n) return;
      const target = 300 + Math.min(Math.abs(velRef.current) / MAX_VEL, 1) * 1500;
      n.filter.frequency.setTargetAtTime(target, n.ctx.currentTime, 0.25);
    }, 120);
    return () => clearInterval(iv);
  }, [on, velRef]);

  const chime = useCallback(hz => {
    const n = nodes.current;
    if (!n || !on) return;
    const { ctx } = n;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = hz;
    g.gain.value = 0;
    g.gain.linearRampToValueAtTime(0.09, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.6);
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 1.7);
  }, [on]);

  return { on, toggle, chime };
}

/* ══════════════════════════════════════════════════════════════
   9. APP — flight physics, gestures, HUD
   ══════════════════════════════════════════════════════════════ */

function App() {
  const vp = useViewport();

  const posRef = useRef(0);
  const velRef = useRef(0);
  const [pos, setPos] = useState(0);
  const [vel, setVel] = useState(0);
  const [caughtN, setCaughtN] = useState(null);
  const [armingN, setArmingN] = useState(null);
  const [settling, setSettling] = useState(false);
  const [touched, setTouched] = useState(false);
  const [heldMs, setHeldMs] = useState(0);
  const [secs, setSecs] = useState(0);

  const caughtRef = useRef(null);
  const armingRef = useRef(null);
  const holdTimer = useRef(null);
  const settleTimer = useRef(null);
  const holdPt = useRef({ x: 0, y: 0 });
  const stageRef = useRef(null);
  const perspRef = useRef(null);
  const tilt = useRef({ tx: 0, ty: 0, x: 0, y: 0 });

  caughtRef.current = caughtN;
  armingRef.current = armingN;
  const audio = useAudio(velRef);

  /* --- flight loop: input adds velocity, friction bleeds it off --- */
  useEffect(() => {
    let raf;
    const tick = () => {
      if (caughtRef.current === null) {
        velRef.current *= FRICTION;
        if (Math.abs(velRef.current) < 0.04) velRef.current = 0;
        let next = posRef.current + velRef.current;
        if (next <= MIN_Z) { next = MIN_Z; velRef.current = 0; }   // only the near end is walled
        posRef.current = next;
      } else {
        velRef.current *= 0.6;   // catching freezes forward momentum
      }

      if (Math.abs(posRef.current - pos) > 0.05) setPos(posRef.current);
      if (Math.abs(velRef.current - vel) > 0.08) setVel(velRef.current);

      const t = tilt.current;
      t.x += (t.tx - t.x) * 0.055;
      t.y += (t.ty - t.y) * 0.055;
      const roll = clamp(velRef.current * 0.012, -1.6, 1.6);
      if (stageRef.current) {
        stageRef.current.style.transform =
          'rotateY(' + t.x.toFixed(3) + 'deg) rotateX(' + t.y.toFixed(3) + 'deg) rotateZ(' + roll.toFixed(3) + 'deg)';
      }
      if (perspRef.current) {
        const p = BASE_PERSP - Math.min(Math.abs(velRef.current), MAX_VEL) * 1.6;
        perspRef.current.style.perspective = p.toFixed(0) + 'px';
      }

      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [pos, vel]);

  /* --- the receipt: seconds airborne, and how long you have held one --- */
  useEffect(() => {
    const iv = setInterval(() => setSecs(s => s + 1), 1000);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    if (caughtN === null) { setHeldMs(0); return; }
    const t0 = Date.now();
    const iv = setInterval(() => setHeldMs(Date.now() - t0), 200);
    return () => clearInterval(iv);
  }, [caughtN]);

  const nudge = useCallback(delta => {
    velRef.current = clamp(velRef.current + delta, -MAX_VEL, MAX_VEL);
    setTouched(true);
  }, []);

  const onWheel = useCallback(e => {
    if (caughtRef.current !== null) return;
    const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? 400 : 1;
    nudge(e.deltaY * unit * WHEEL_GAIN);
  }, [nudge]);

  const beginSettle = useCallback(() => {
    setSettling(true);
    clearTimeout(settleTimer.current);
    settleTimer.current = setTimeout(() => setSettling(false), 860);
  }, []);

  const release = useCallback(() => {
    beginSettle();
    setCaughtN(null);
    audio.chime(392);
  }, [beginSettle, audio]);

  const catchEcho = useCallback(n => {
    beginSettle();
    velRef.current = 0;
    setCaughtN(n);
    setTouched(true);
    audio.chime(528);
    if (navigator.vibrate) navigator.vibrate(14);
  }, [beginSettle, audio]);

  const onHoldEnd = useCallback(() => {
    clearTimeout(holdTimer.current);
    setArmingN(null);
  }, []);

  const onHoldStart = useCallback((n, e) => {
    if (caughtRef.current === n) { release(); return; }
    if (caughtRef.current !== null) return;
    holdPt.current = { x: e.clientX, y: e.clientY };
    setArmingN(n);
    clearTimeout(holdTimer.current);
    holdTimer.current = setTimeout(() => { setArmingN(null); catchEcho(n); }, HOLD_MS);
  }, [catchEcho, release]);

  const onToggle = useCallback(n => {
    if (caughtRef.current === n) release(); else catchEcho(n);
  }, [catchEcho, release]);

  /* --- keyboard flight --- */
  useEffect(() => {
    const onKey = e => {
      if (e.key === 'Escape') { if (caughtRef.current !== null) release(); return; }
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (caughtRef.current !== null) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); nudge(46); }
      else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); nudge(-46); }
      else if (e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); nudge(150); }
      else if (e.key === 'PageUp') { e.preventDefault(); nudge(-150); }
      else if (e.key === 'Home') { e.preventDefault(); velRef.current = 0; posRef.current = 0; setPos(0); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [nudge, release]);

  /* --- touch: swipe up to fly, and a fling that coasts --- */
  const touchY = useRef(null);
  const onTouchStart = e => { touchY.current = e.touches[0].clientY; };
  const onTouchMove = e => {
    if (touchY.current === null || caughtRef.current !== null) return;
    const y = e.touches[0].clientY;
    nudge((touchY.current - y) * DRAG_GAIN);
    touchY.current = y;
  };
  const onTouchEnd = () => { touchY.current = null; };

  /* a drag that started on a card is a flight, not a catch */
  const onPointerMove = e => {
    if (armingRef.current !== null) {
      const dx = e.clientX - holdPt.current.x;
      const dy = e.clientY - holdPt.current.y;
      if (dx * dx + dy * dy > DRAG_SLOP * DRAG_SLOP) onHoldEnd();
    }
    if (vp.touch) return;   // no pointer parallax on touch devices
    const t = tilt.current;
    t.tx = ((e.clientX / window.innerWidth) - 0.5) * 5;
    t.ty = -((e.clientY / window.innerHeight) - 0.5) * 4;
  };

  /* --- which slice of the infinite feed is currently in front of us --- */
  const visible = useMemo(() => {
    const out = [];
    for (let n = firstIndex(pos); n <= lastIndex(pos); n++) {
      const e = echoAt(n);
      if (!nearMarker(e.z)) out.push(e);
    }
    return out;
  }, [pos]);

  const markers = useMemo(() => {
    const out = [];
    const from = Math.max(1, Math.floor((pos + CULL_BEHIND) / MILESTONE));
    const to = Math.floor((pos + CULL_AHEAD) / MILESTONE);
    for (let k = from; k <= to; k++) if (k >= 1) out.push(k);
    return out;
  }, [pos]);

  const caught = caughtN === null ? null : echoAt(caughtN);
  const passed = Math.max(0, Math.floor((pos - FIRST_Z) / SPACING) + 1);
  const nextUp = visible.find(e => e.z - pos > SWEET_FAR);
  const speed = (Math.abs(vel) * 60) / 1000;   // m/frame at 60 fps → km/s
  const held = Math.floor(heldMs / 1000);
  const heldLabel = fmtClock(held);
  const clock = fmtClock(secs);

  return (
    <main
      className="void"
      onWheel={onWheel}
      onPointerMove={onPointerMove}
      onTouchStart={onTouchStart}
      onTouchMove={onTouchMove}
      onTouchEnd={onTouchEnd}
      onTouchCancel={onTouchEnd}
      onPointerDown={e => { if (e.target === e.currentTarget && caughtN !== null) release(); }}
    >
      <div className="nebula" aria-hidden="true" style={{ opacity: caughtN !== null ? 0.34 : 1 }} />
      <Field camRef={posRef} velRef={velRef} vp={vp} />

      <div
        className={'spotlight' + (caught ? ' on' : '')}
        aria-hidden="true"
        style={caught ? { background: 'radial-gradient(circle, ' + caught.c + '26 0%, ' + caught.c + '0a 36%, transparent 68%)' } : undefined}
      />

      <div className="stage" ref={perspRef}>
        <div className="stage-inner" ref={stageRef}>
          <Masthead distance={MASTHEAD_Z - pos} anyCaught={caughtN !== null} vp={vp} />

          {markers.map(k => (
            <Marker
              key={'m' + k}
              k={k}
              distance={k * MILESTONE - pos}
              anyCaught={caughtN !== null}
              clock={clock}
              passed={passed}
              vp={vp}
            />
          ))}

          {visible.map(echo => (
            <Echo
              key={echo.n}
              echo={echo}
              distance={caughtN === echo.n ? FOCUS_Z : echo.z - pos}
              isCaught={caughtN === echo.n}
              anyCaught={caughtN !== null}
              settling={settling}
              arming={armingN === echo.n}
              held={heldLabel}
              vp={vp}
              onHoldStart={onHoldStart}
              onHoldEnd={onHoldEnd}
              onToggle={onToggle}
            />
          ))}
        </div>
      </div>

      <div className="vignette" aria-hidden="true" style={{ opacity: caughtN !== null ? 1.7 : 1 }} />

      {!vp.compact && (
        <svg className="grain" aria-hidden="true" width="100%" height="100%">
          <filter id="grain-noise">
            <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="3" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
          <rect width="100%" height="100%" filter="url(#grain-noise)" />
        </svg>
      )}

      {/* ══════════════════ HUD ══════════════════ */}
      <div className="hud">
        <span className="bracket tl" /><span className="bracket tr" />
        <span className="bracket bl" /><span className="bracket br" />

        <div className="hud-tl">
          <div className="wordmark-sm">Aether</div>
          <div className="eyebrow" style={{ marginTop: 7 }}>
            {vp.compact ? 'Z-axis social' : 'Z-axis social · the feed does not end'}
          </div>
        </div>

        <div className="hud-tr">
          <div className="readout">DEPTH <b>{fmtDepth(Math.max(0, pos))}</b></div>
          <div className="readout">{speed.toFixed(2)} <b>km/s</b></div>
          <div className="readout">PASSED <b>{passed}</b> · <b>{clock}</b></div>
          {!vp.compact && (
            <div className="throttle" aria-hidden="true" style={{ marginTop: 4 }}>
              <i style={{ transform: 'scaleX(' + clamp01(Math.abs(vel) / MAX_VEL) + ')', background: 'linear-gradient(90deg, #8B7CFF, #5EE7FF)' }} />
            </div>
          )}
        </div>

        {/* proximity radar: everything inside the next 3 km, sliding down as it nears */}
        <div className="radar" aria-hidden="true">
          <div className="radar-line" />
          {markers.map(k => {
            const d = k * MILESTONE - pos;
            if (d < 0) return null;
            return <div key={'rm' + k} className="blip marker" style={{ top: (100 - (d / CULL_AHEAD) * 100) + '%', opacity: caughtN !== null ? 0.25 : 0.75 }} />;
          })}
          {visible.map(e => {
            const d = caughtN === e.n ? FOCUS_Z : e.z - pos;
            if (d < 0) return null;
            const isC = caughtN === e.n;
            return (
              <div
                key={e.n}
                className={'blip' + (isC ? ' caught' : '')}
                style={{
                  top: (100 - (d / CULL_AHEAD) * 100) + '%',
                  background: isC ? e.c : e.c + '7a',
                  boxShadow: isC ? '0 0 11px ' + e.c : 'none',
                  opacity: caughtN !== null && !isC ? 0.25 : 1
                }}
              />
            );
          })}
          <div className="lens-line" />
          <div className="eyebrow" style={{ position: 'absolute', top: -20, right: 0, fontSize: 8 }}>3 km</div>
          <div className="eyebrow" style={{ position: 'absolute', bottom: -20, right: 0, fontSize: 8 }}>lens</div>
        </div>

        <div className="hud-bl">
          <div className="panel">
            {caught ? (
              <div>
                <div className="eyebrow" style={{ color: caught.c }}>Caught · held {heldLabel}</div>
                <div className="readout" style={{ marginTop: 8, lineHeight: 1.6 }}>
                  <b>{caught.author}</b> · {caught.place}
                  {!vp.compact && <br />}
                  {vp.compact ? ' · ' : ''}resonance {Math.round(caught.res * 100)}
                </div>
              </div>
            ) : nextUp ? (
              <div>
                <div className="eyebrow">Next echo ahead</div>
                <div className="readout" style={{ marginTop: 8, lineHeight: 1.6 }}>
                  <b>{fmt(nextUp.z - pos)}</b> m · {nextUp.author}
                  {!vp.compact && <br />}
                  {vp.compact ? ' · ' : ''}
                  <span style={{ color: 'var(--ink-mute)' }}>{nextUp.place}</span>
                </div>
              </div>
            ) : (
              <div>
                <div className="eyebrow">Open void</div>
                <div className="readout" style={{ marginTop: 8 }}>keep flying</div>
              </div>
            )}
          </div>
          {!vp.compact && (
            <div className="eyebrow" style={{ marginTop: 14, lineHeight: 1.9, letterSpacing: '0.13em' }}>
              You cannot like an echo.<br />You can only hold it still.
            </div>
          )}
        </div>

        <div className="hud-br">
          <button className="pill" onClick={audio.toggle} aria-pressed={audio.on} style={audio.on ? { color: 'var(--ink)', borderColor: 'var(--hair-lit)' } : undefined}>
            {audio.on ? '◼' : '▶'}{vp.compact ? '' : audio.on ? ' Drone on' : ' Drone'}
          </button>
          {caught && <button className="pill" onClick={release}>Release{vp.compact ? '' : ' · Esc'}</button>}
        </div>

        <div className="hud-bc">
          <div
            className="hint"
            style={{ opacity: caught ? 0 : touched ? 0.4 : 1, transform: touched ? 'translateY(4px)' : 'none' }}
          >
            {!touched && vp.touch && (
              <svg className="chev" width="16" height="10" viewBox="0 0 16 10" aria-hidden="true">
                <path d="M1 9L8 2l7 7" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
              </svg>
            )}
            {vp.touch ? 'Swipe up to fly · hold to catch' : 'Scroll to fly forward — hold an echo to catch it'}
          </div>
        </div>
      </div>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
window.__AETHER_UP = true;
</script>

<script>
  /* Safety net: if the browser fired DOMContentLoaded before Babel attached its
     listener, transform the JSX by hand. Guarded so it can never mount twice. */
  window.addEventListener('load', function () {
    if (!window.__AETHER_UP && window.Babel && window.Babel.transformScriptTags) {
      window.Babel.transformScriptTags();
    }
  });
</script>
</body>
</html>
